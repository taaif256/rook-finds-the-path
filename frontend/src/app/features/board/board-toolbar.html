<div class="toolbar" role="toolbar" aria-label="Board editing">
  <div class="group" role="group" aria-label="Tool">
    @for (tool of tools; track tool.id) {
      <button
        type="button"
        class="tool"
        [attr.aria-pressed]="interaction.tool() === tool.id"
        [title]="tool.hint"
        (click)="interaction.selectTool(tool.id)"
      >
        <span class="node tool__swatch" data-shade="light" [attr.data-kind]="tool.id" aria-hidden="true"></span>
        {{ tool.label }}
      </button>
    }
  </div>

  <div class="group">
    <label class="size">
      Board size
      <select [value]="currentSize()" (change)="onSizeChange($event)">
        @for (option of sizeOptions; track option) {
          <option [value]="option" [selected]="option === currentSize()">{{ option }} × {{ option }}</option>
        }
      </select>
    </label>
    <button type="button" class="action" [disabled]="!canClearVisualization()" (click)="interaction.clearVisualization()">
      Clear Visualization
    </button>
    <button type="button" class="action" [disabled]="!canResetBoard()" (click)="interaction.resetBoard()">
      Reset Board
    </button>
  </div>
</div>
<p class="size-note">Changing the board size clears the board.</p>
